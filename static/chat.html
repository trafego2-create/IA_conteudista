<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova Sim - Agente Conteudista</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --painel: #ffffff;
    --texto: #1c1e21;
    --texto-suave: #6b7280;
    --borda: #e2e4e8;
    --usuario-bg: #2563eb;
    --usuario-texto: #ffffff;
    --assistente-bg: #eef0f3;
    --assistente-texto: #1c1e21;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b;
      --painel: #1e2128;
      --texto: #e7e9ec;
      --texto-suave: #9aa0a8;
      --borda: #2c3038;
      --assistente-bg: #2a2d34;
      --assistente-texto: #e7e9ec;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--texto);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--borda);
    background: var(--painel);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--texto-suave);
  }
  #mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.usuario {
    align-self: flex-end;
    background: var(--usuario-bg);
    color: var(--usuario-texto);
    border-bottom-right-radius: 4px;
  }
  .msg.assistente {
    align-self: flex-start;
    background: var(--assistente-bg);
    color: var(--assistente-texto);
    border-bottom-left-radius: 4px;
  }
  .msg.carregando {
    align-self: flex-start;
    background: var(--assistente-bg);
    color: var(--texto-suave);
    font-style: italic;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--borda);
    background: var(--painel);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--texto);
    max-height: 120px;
  }
  button {
    border: none;
    background: var(--usuario-bg);
    color: #fff;
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .questao-card {
    align-self: flex-start;
    max-width: 88%;
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .questao-card .rotulo {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--texto-suave);
    margin-top: 8px;
  }
  .questao-card .rotulo:first-child {
    margin-top: 0;
  }
  .questao-card .conteudo {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .questao-acoes {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-aprovar, .btn-rejeitar {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    font-size: 13px;
  }
  .btn-aprovar {
    background: #16a34a;
  }
  .btn-rejeitar {
    background: #dc2626;
  }
  .questao-decisao {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .questao-decisao.aprovada { color: #16a34a; }
  .questao-decisao.rejeitada { color: #dc2626; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agente Conteudista - Aprova Sim</h1>
    <p>Peça para gerar questões (Mestre em Questões/Revisão Farol) ou montar um simulado.</p>
  </header>
  <div id="mensagens"></div>
  <form id="form-envio">
    <textarea id="campo-mensagem" rows="1" placeholder="Ex.: gere 20 questões de Direito Constitucional do INSS" autofocus></textarea>
    <button type="submit" id="botao-enviar">Enviar</button>
  </form>
</div>

<script>
  const historico = [];
  const listaMensagens = document.getElementById('mensagens');
  const form = document.getElementById('form-envio');
  const campo = document.getElementById('campo-mensagem');
  const botao = document.getElementById('botao-enviar');

  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  function renderizarLatex(el) {
    if (typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
        ],
        throwOnError: false,
      });
    } catch (erro) {
      // formula mal formada nao pode quebrar o resto da mensagem
    }
  }

  function renderizarMensagem(role, conteudo) {
    const bolha = document.createElement('div');
    bolha.className = 'msg ' + (role === 'user' ? 'usuario' : 'assistente');
    bolha.innerHTML = escaparHtml(conteudo);
    listaMensagens.appendChild(bolha);
    renderizarLatex(bolha);
    listaMensagens.scrollTop = listaMensagens.scrollHeight;
    return bolha;
  }

  function linha(rotulo, texto) {
    if (!texto) return '';
    return '<div class="rotulo">' + escaparHtml(rotulo) + '</div>'
      + '<div class="conteudo">' + escaparHtml(texto) + '</div>';
  }

  async function decidirQuestao(id, decisao, card, areaAcoes) {
    const botoes = areaAcoes.querySelectorAll('button');
    botoes.forEach((b) => b.disabled = true);
    try {
      const resposta = await fetch('/questoes/' + id + '/revisar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decisao: decisao }),
      });
      if (!resposta.ok) {
        botoes.forEach((b) => b.disabled = false);
        alert('Erro ao registrar a decisão (status ' + resposta.status + ').');
        return;
      }
      const rotulo = decisao === 'aprovada' ? 'Aprovada ✓' : 'Rejeitada ✗';
      const div = document.createElement('div');
      div.className = 'questao-decisao ' + decisao;
      div.textContent = rotulo;
      areaAcoes.replaceWith(div);
    } catch (erro) {
      botoes.forEach((b) => b.disabled = false);
      alert('Erro de conexão ao registrar a decisão.');
    }
  }

  function linhaAlternativas(alternativas) {
    if (!alternativas) return '';
    const texto = Object.keys(alternativas).sort().map((letra) => letra + ') ' + alternativas[letra]).join('\n');
    return linha('Alternativas', texto);
  }

  function renderizarQuestao(questao) {
    const card = document.createElement('div');
    card.className = 'questao-card';

    let html = '';
    html += linha('Gabarito', questao.gabarito);
    html += linha('Enunciado', questao.enunciado);
    html += linhaAlternativas(questao.alternativas);
    html += linha('Comentário', questao.comentario);
    html += linha('Resposta', questao.resposta);
    card.innerHTML = html;

    if (questao.status === 'pendente_revisao' && questao.id) {
      const acoes = document.createElement('div');
      acoes.className = 'questao-acoes';

      const btnAprovar = document.createElement('button');
      btnAprovar.className = 'btn-aprovar';
      btnAprovar.textContent = 'Aprovar';
      btnAprovar.addEventListener('click', () => decidirQuestao(questao.id, 'aprovada', card, acoes));

      const btnRejeitar = document.createElement('button');
      btnRejeitar.className = 'btn-rejeitar';
      btnRejeitar.textContent = 'Rejeitar';
      btnRejeitar.addEventListener('click', () => decidirQuestao(questao.id, 'rejeitada', card, acoes));

      acoes.appendChild(btnAprovar);
      acoes.appendChild(btnRejeitar);
      card.appendChild(acoes);
    } else if (questao.status) {
      const div = document.createElement('div');
      div.className = 'questao-decisao ' + questao.status;
      div.textContent = questao.status === 'rejeitada' ? 'Rejeitada automaticamente (citação não confere) ✗' : questao.status;
      card.appendChild(div);
    }

    listaMensagens.appendChild(card);
    renderizarLatex(card);
    listaMensagens.scrollTop = listaMensagens.scrollHeight;
  }

  async function enviarMensagem(texto) {
    historico.push({ role: 'user', content: texto });
    renderizarMensagem('user', texto);

    const indicador = document.createElement('div');
    indicador.className = 'msg carregando';
    indicador.textContent = 'digitando...';
    listaMensagens.appendChild(indicador);
    listaMensagens.scrollTop = listaMensagens.scrollHeight;

    botao.disabled = true;
    try {
      const resposta = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagens: historico }),
      });
      indicador.remove();

      if (!resposta.ok) {
        renderizarMensagem('assistant', 'Erro ao falar com o agente (status ' + resposta.status + ').');
        return;
      }
      const dados = await resposta.json();
      historico.push({ role: 'assistant', content: dados.resposta });
      renderizarMensagem('assistant', dados.resposta);
      (dados.questoes_geradas || []).forEach(renderizarQuestao);
    } catch (erro) {
      indicador.remove();
      renderizarMensagem('assistant', 'Erro de conexão com o agente.');
    } finally {
      botao.disabled = false;
      campo.focus();
    }
  }

  form.addEventListener('submit', (evento) => {
    evento.preventDefault();
    const texto = campo.value.trim();
    if (!texto) return;
    campo.value = '';
    campo.style.height = 'auto';
    enviarMensagem(texto);
  });

  campo.addEventListener('keydown', (evento) => {
    if (evento.key === 'Enter' && !evento.shiftKey) {
      evento.preventDefault();
      form.requestSubmit();
    }
  });

  campo.addEventListener('input', () => {
    campo.style.height = 'auto';
    campo.style.height = campo.scrollHeight + 'px';
  });

  renderizarMensagem('assistant', 'Olá! Posso gerar questões novas (Mestre em Questões ou Revisão Farol) ou montar um simulado a partir do banco já aprovado. O que você precisa?');
</script>
</body>
</html>
